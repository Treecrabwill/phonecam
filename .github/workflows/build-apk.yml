name: Build app & publish viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a Release
  pages: write      # deploy the viewer page
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-apk
          path: PhoneCam.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PhoneCam.apk \
            --title "PhoneCam (latest build)" \
            --notes "Download PhoneCam.apk on the old phone and open it to install. Built from ${GITHUB_SHA::7}."

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: mkdir site && cp app/src/main/assets/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-viewer:
    needs: viewer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
