plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonecam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.phonecam.app'
        minSdk 21          // Android 5.0+, so very old phones work
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // Fixed signing key so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file('phonecam-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
